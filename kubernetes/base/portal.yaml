apiVersion: v1
kind: Service
metadata:
  name: exchange-portal
  labels:
    app: exchange-portal
    app.kubernetes.io/name: exchange-portal
    app.kubernetes.io/part-of: national-healthcare-data-exchange
    app.kubernetes.io/component: portal
spec:
  selector:
    app: exchange-portal
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exchange-portal
  labels:
    app.kubernetes.io/name: exchange-portal
    app.kubernetes.io/part-of: national-healthcare-data-exchange
    app.kubernetes.io/component: portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: exchange-portal
  template:
    metadata:
      labels:
        app: exchange-portal
        app.kubernetes.io/name: exchange-portal
        app.kubernetes.io/part-of: national-healthcare-data-exchange
        app.kubernetes.io/component: portal
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exchange-portal
          image: healthcare/portal:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
