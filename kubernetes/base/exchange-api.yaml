apiVersion: v1
kind: Service
metadata:
  name: exchange-api
  labels:
    app: exchange-api
    app.kubernetes.io/name: exchange-api
    app.kubernetes.io/part-of: national-healthcare-data-exchange
spec:
  selector:
    app: exchange-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exchange-api
  labels:
    app.kubernetes.io/name: exchange-api
    app.kubernetes.io/part-of: national-healthcare-data-exchange
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: exchange-api
  template:
    metadata:
      labels:
        app: exchange-api
        app.kubernetes.io/name: exchange-api
        app.kubernetes.io/part-of: national-healthcare-data-exchange
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: exchange-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exchange-api
          image: healthcare/exchange-api:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: exchange-config
            - secretRef:
                name: exchange-secrets
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
