apiVersion: v1
kind: Secret
metadata:
  name: exchange-secrets
  labels:
    app.kubernetes.io/part-of: national-healthcare-data-exchange
    app.kubernetes.io/component: api
type: Opaque
# Local development placeholders only. Production overlays should source these
# values from a managed secret store, SOPS/SealedSecrets, or ExternalSecrets.
stringData:
  DATABASE_URL: postgres://hde:hde_password@postgres:5432/hde
  JWT_SECRET: local-dev-change-me-with-32-characters
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  labels:
    app.kubernetes.io/part-of: national-healthcare-data-exchange
    app.kubernetes.io/component: database
type: Opaque
# Local development bootstrap credentials only. Keep production database
# credentials in a managed secret store and rotate independently from app env.
stringData:
  POSTGRES_DB: hde
  POSTGRES_USER: hde
  POSTGRES_PASSWORD: hde_password
