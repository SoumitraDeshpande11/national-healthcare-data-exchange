services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hde
      POSTGRES_USER: hde
      POSTGRES_PASSWORD: hde_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hde -d hde"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-06-11T03-13-30Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: soumitra
      MINIO_ROOT_PASSWORD: deshpande
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  vault:
    image: hashicorp/vault:1.17
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"

  vault-bootstrap:
    image: hashicorp/vault:1.17
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
    command:
      - sh
      - -c
      - |
        sleep 3
        vault kv put secret/hde/exchange-api \
          DATABASE_URL=postgres://hde:hde_password@postgres:5432/hde \
          REDIS_URL=redis://redis:6379 \
          JWT_SECRET=local-dev-change-me-with-32-characters \
          MINIO_ENDPOINT=http://minio:9000 \
          MINIO_ACCESS_KEY=soumitra \
          MINIO_SECRET_KEY=deshpande \
          MINIO_BUCKET=healthcare-documents \
          ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173 \
          AUDIT_LOG_PATH=/var/log/hde/audit.log
    depends_on:
      - vault

  exchange-api:
    build:
      context: .
      dockerfile: services/exchange-api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://hde:hde_password@postgres:5432/hde
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-dev-change-me-with-32-characters
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: soumitra
      MINIO_SECRET_KEY: deshpande
      MINIO_BUCKET: healthcare-documents
      VAULT_ENABLED: "true"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      VAULT_SECRET_PATH: secret/data/hde/exchange-api
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_LOG_INDEX: hde-api-audit-direct
      API_LOG_PATH: /var/log/hde/api.log
      AUDIT_LOG_PATH: /var/log/hde/audit.log
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-bootstrap:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    volumes:
      - hde-api-logs:/var/log/hde
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  portal:
    build:
      context: .
      dockerfile: services/portal/Dockerfile
    depends_on:
      - exchange-api
    ports:
      - "5173:80"

  prometheus:
    image: prom/prometheus:v2.52.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - exchange-api

  grafana:
    image: grafana/grafana:11.0.0
    environment:
      GF_SECURITY_ADMIN_USER: soumitra
      GF_SECURITY_ADMIN_PASSWORD: deshpande
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  jenkins:
    build:
      context: .
      dockerfile: docker/jenkins/Dockerfile
    user: root
    environment:
      JENKINS_ADMIN_ID: soumitra
      JENKINS_ADMIN_PASSWORD: deshpande
      PIPELINE_JOB_NAME: national-healthcare-data-exchange
      REPOSITORY_URL: https://github.com/SoumitraDeshpande11/national-healthcare-data-exchange.git
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elastic-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.1
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.14.1
    user: root
    command: ["--strict.perms=false", "-e"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      KIBANA_HOST: http://kibana:5601
    volumes:
      - ./docker/logging/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - hde-api-logs:/var/log/hde:ro
      - filebeat-data:/usr/share/filebeat/data
    depends_on:
      - elasticsearch
      - exchange-api

volumes:
  postgres-data:
  minio-data:
  grafana-data:
  jenkins-data:
  elastic-data:
  hde-api-logs:
  filebeat-data:
